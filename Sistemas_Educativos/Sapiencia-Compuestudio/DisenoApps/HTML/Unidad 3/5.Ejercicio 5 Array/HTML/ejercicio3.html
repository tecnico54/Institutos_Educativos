<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../CSS/ejercicio3.css">
        <title>Inventario de productos</title>
    </head>
    <body>
        <a href="../index.html"><-- Menú</a>
        <h1>Inventario de productos</h1>
        <form id="formulario">
        <label for="producto">Nombre del producto:</label>
        <input type="text" id="producto" required>
        <label for="precio">Precio unitario:</label>
        <input type="number" id="precio" min="0.01" step="0.01">
        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" min="1" step="1">
        <button type="button" onclick="agregarProducto()">Agr...</button>
    </form>
    <h2>Productos registrados</h2>
    <table>
        <thead>
            <tr>
                <th>Producto</th>
                <th>Precio</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody id="tabla"></tbody>
    </table>
    <h2>Resultados</h2>
    <p id="total"></p>
        <script src="../JavaScript/ejercicio3.js"></script>
    </body>
</html>
